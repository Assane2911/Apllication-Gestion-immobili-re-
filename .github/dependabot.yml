# Mises à jour automatiques des dépendances : une seule pull request par semaine et par dossier, qui regroupe les
# mises à jour MINEURES et les CORRECTIFS. Les versions MAJEURES ne sont jamais proposées : chacune est une migration
# à décider et à tester à part (par exemple express 5, vite 8, typescript 7).
#
# Chaque pull request passe la CI complète (types, tests, démarrage réel, construction) avant d'être fusionnée.
# Les avis de sécurité sont suivis à part, chaque semaine, par .github/workflows/avis-securite.yml.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Dépendances (backend) :"
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # pdfkit 0.21 charge fontkit v3 (module ES seul) : la fonction Vercel plante au démarrage (ERR_REQUIRE_ESM,
      # 26 novembre 2026). À ne retenter qu'après l'avoir essayée sur un aperçu Vercel, pas seulement en CI.
      - dependency-name: "pdfkit"
        versions: [">=0.21.0"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "Dépendances (frontend) :"
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Dépendances (workflows) :"
    groups:
      mineures-et-correctifs:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
