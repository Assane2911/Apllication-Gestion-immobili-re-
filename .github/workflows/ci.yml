name: CI

# Jusqu'ici, le seul contrôle automatique du projet était le build Vercel,
# c'est-à-dire APRÈS le push et en production : c'est ainsi qu'une simple
# variable inutilisée (TS6133) a fait échouer un déploiement. Ce workflow
# rejoue les mêmes vérifications sur chaque push, en quelques minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lire le code suffit pour construire et tester : le jeton du workflow n'a aucun droit d'écriture. Sans ce bloc,
# il recevait les droits par défaut du dépôt (parfois en écriture) pour chaque étape, y compris celles qui
# exécutent le code d'une pull request.
permissions:
  contents: read

# Un push qui en suit un autre de près annule le run précédent, devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Vérifier les types
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      # Aucun secret n'est nécessaire : la suite tourne sur une base PGlite en
      # mémoire et neutralise elle-même SMTP, Sentry, Supabase et les clés de
      # paiement (voir src/test/setupTestDb.ts). Elle ne peut donc en aucun cas
      # toucher la vraie base ni envoyer d'email réel.
      - name: Lancer les tests
        working-directory: backend
        run: npm test

  # Démarrage réel du backend, tel qu'il tourne en production : Node 24 (celui de Vercel), dépendances de production
  # SEULEMENT (les outils de test ne sont pas là-bas), instrumentation Sentry active. Du 5 au 7 octobre 2026, le site est
  # resté en panne deux jours alors que la CI était verte : les tests tournent sous Node 22, avec toutes les dépendances de
  # développement, et par un chargeur qui n'est pas celui du serveur. Ce job charge dist/app.js et exige /api/health = 200.
  # Il attrape ce qui ne manque qu'en production (une dépendance de développement utilisée par l'application, un module qui
  # ne se charge plus) ; il ne remplace pas un contrôle sur le déploiement Vercel lui-même.
  demarrage:
    name: Backend — démarrage réel (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Compiler
        working-directory: backend
        run: npm run build

      # Comme en production : plus aucune dépendance de développement.
      - name: Retirer les dépendances de développement
        working-directory: backend
        run: npm prune --omit=dev

      - name: Démarrer l'application et appeler /api/health
        working-directory: backend
        run: node scripts/verifier-demarrage.js

  frontend:
    name: Frontend — build et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      # `tsc -b` et non `tsc --noEmit -p tsconfig.json` : le tsconfig.json du
      # frontend est un fichier "solution" ("files": [], seulement des
      # "references"). Le compiler directement ne vérifie AUCUN fichier et
      # renvoie toujours un succès. Seul le mode build suit les références et
      # applique les options de tsconfig.app.json (dont noUnusedLocals), donc
      # reproduit exactement ce que fait Vercel via `npm run build`.
      - name: Vérifier les types (comme le build Vercel)
        working-directory: frontend
        run: npx tsc -b

      - name: Lancer les tests
        working-directory: frontend
        run: npm test

      # Le build complet en dernier : si une erreur doit survenir, autant que ce
      # soit le typage ou un test qui la nomme précisément, plutôt qu'un échec
      # de bundling plus difficile à lire.
      - name: Construire l'application
        working-directory: frontend
        run: npm run build

      # Le linter en dernier, volontairement : une remarque de style ne doit
      # jamais masquer une erreur de compilation ou un test casse, qui sont
      # autrement plus urgents a voir.
      - name: Analyser le code (oxlint)
        working-directory: frontend
        run: npm run lint
